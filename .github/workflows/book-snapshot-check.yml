name: Verify local book browsing
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'data/book-catalog.js'
      - 'tools/book-covers/check-local.cjs'
      - '.github/workflows/book-snapshot-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-book-browser-check
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/book-browser" playwright --ignore-scripts --no-audit --no-fund
      - name: Verify published shelf without external sources
        env:
          PLAYWRIGHT_NODE_MODULES: ${{ runner.temp }}/book-browser/node_modules
        run: node tools/book-covers/check-local.cjs
      - run: node tools/book-covers/audit.mjs --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-snapshot-live-check
          path: |
            book-snapshot-live-check.json
            book-snapshot-live.png
