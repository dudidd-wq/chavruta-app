name: PR check

# Lightweight gate for pull requests into main.
# Do not change or re-enable the existing cover, news, or snapshot workflows here.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate HTML, JSON, and content guard
        run: python tools/ci/pr_check.py

      - name: Syntax-check JavaScript
        run: |
          node --check status.js
          node --check data/project-status.js
          node --check app.js
          node --check data/cite-resolutions.js

      - name: Personalization styles smoke test (each style loads without JS errors)
        run: |
          pip install --quiet playwright==1.48.0
          python -m playwright install --with-deps chromium
          python -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
          node --check personalize.js
          node --check personalize-head.js
          python tests/theme_smoke.py http://127.0.0.1:8765/
