name: PR check

# Lightweight gate for pull requests into main.
# Do not change or re-enable the existing cover, news, or snapshot workflows here.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate HTML, JSON, and content guard
        run: python tools/ci/pr_check.py

      - name: Syntax-check JavaScript
        run: |
          node --check status.js
          node --check data/project-status.js
