name: Prepare book cover thumbnails
on:
  push:
    branches: [main]
    paths:
      - 'tools/book-covers/**'
      - '.github/workflows/book-covers.yml'
      - 'data/book-catalog.js'
      - 'data/tree.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: book-cover-thumbnails
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix tools/book-covers --ignore-scripts --no-audit --no-fund
      - run: node tools/book-covers/build.mjs data --publish-checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit validated thumbnails
        run: |
          git add data/book-covers.js data/book-covers/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Prepare validated first-page book thumbnails'
          git pull --rebase origin main
          git push origin HEAD:main
