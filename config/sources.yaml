# מקורות שנעקבים — אתר חברותא
# role:
#   primary   — מקור ראשוני: ממנו בונים את הניתוח
#   analysis  — אתר שמנתח או מסכם מאמרים ושיחות: טריגר לנושא + קישור וקרדיט
#   whatsnew  — מקור למדור "מה חדש בעולם החסידות" בלבד (לא בונים ממנו ניתוח)
#   archive   — מאגר עיון: לאימות ולקישור, לא נעקב
# medium (סוג התוכן — קובע את הסיווג למדור "מה חדש", ראו style/takzir-ma-chadash.md):
#   text            — אתר כתוב: כל פריט מסווג לגופו
#   news            — אתר חדשות: כל פריט מסווג לגופו (רוב הפריטים יוצאים)
#   bulletin        — גיליון שבועי: נכנס תמיד כ"גיליון"
#   rebbe_recording — הקלטה של הרבי (שמע/וידאו): לא נכנס — המדור כתוב בלבד
#   shiur | podcast — שיעורים בעל־פה (שמע/וידאו) ופודקאסטים: לא נכנסים
# detect.type:
#   rss | json_catalog | wp_media | sitemap (filter/follow) | torahtable (נתוני הדף) | page_diff | browser (נחסם לקוד; נבדק דרך הדפדפן) | none

primary:
  - id: chabadlibrary
    name: ספריית חב״ד
    url: "https://www.chabadlibrary.org/books/"
    ingest: api            # /books/api/main?path=/<id>
  - id: lahak
    name: לה״ק — ועד הנחות בלשון הקודש
    url: "https://www.lahak.org/"
    ingest: pdf            # קונטרס שבועי; האתר חוסם קוד (403) — נבדק דרך הדפדפן
    detect: {type: browser, url: "https://www.lahak.org/"}
    whatsnew: true
  - id: chassidutbehirah
    name: חסידות בהירה
    url: "https://chassidutbehirah.com/"
    ingest: wp_rest        # /wp-json/wp/v2/pages
  - id: hebrewbooks
    name: היברובוקס
    url: "https://hebrewbooks.org/"
    ingest: manual_pdf     # חוסם בוטים
  - id: kehot_kuntreisim
    name: הוצאת קה״ת (קונטרסים)
    url: "https://www.kehot.org/Kuntreisim"
    ingest: pdf            # קובצי PDF של מאמרים ושיחות של הרבנים; תאריך ההעלאה בנתיב הקובץ
    detect: {type: kehot_kuntreisim, url: "https://www.kehot.org/Kuntreisim"}
    medium: text
    whatsnew: true
  - id: chabadlibrarybooks
    name: ספריית חב״ד ספרים
    url: "http://chabadlibrarybooks.com/"
    ingest: manual_pdf     # robots אוסר גישה אוטומטית

